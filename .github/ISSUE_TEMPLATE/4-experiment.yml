name: Experiment
description: A run or study with a question and a result
labels: ["area:research"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question and hypothesis
      description: What is tested, and what result would refute it. Never n=1; costs logged.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design and budget
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Also add the matching area label (forms cannot set it from this field).
      options: [product, research, learning, business, finance, company, infra, writing, docs]
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Project
      description: e.g. persenix, learn, cortex, koyulabs-site. Also add the matching project label.
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent issue
      description: The lab issue this belongs to, if any (e.g. koyu-labs/koyu-labs#16). Add it as a sub-issue there.
